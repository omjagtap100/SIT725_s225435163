services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/volunteerhub
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      JWT_SECRET: volunteerhub-docker-jwt-secret
      JWT_EXPIRES_IN: 24h
      STUDENT_NAME: Om Jagtap
      STUDENT_ID: s225435163
      RUN_SEED: "true"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3300:3300"
    environment:
      PORT: 3300
      API_BASE_URL: http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo_data:
